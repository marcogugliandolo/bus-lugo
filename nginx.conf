# Xa Vén: sirve la web estática en el puerto 3000 del contenedor.
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Detrás del proxy, las redirecciones no deben llevar el http://host:3000 interno.
    absolute_redirect off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/javascript text/css image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Avisos al móvil: el servicio se busca al usarlo, así nginx arranca aunque no esté.
    location /api/avisos {
        resolver 127.0.0.11 valid=10s;
        set $avisos http://bus-lugo-push:3001;
        proxy_pass $avisos;
        proxy_set_header X-Real-IP $http_x_real_ip;
        client_max_body_size 16k;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # De momento la web es la demo.
    location = / { return 302 /demo/; }
    location = /demo { return 301 /demo/; }

    location /demo/ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/ /demo/index.html;
    }

    location /demo/vendor/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    types {
        text/html html;
        text/css css;
        application/javascript js mjs;
        application/json json;
        application/manifest+json webmanifest;
        image/svg+xml svg;
        image/png png;
        font/woff2 woff2;
        text/plain txt;
    }
}
