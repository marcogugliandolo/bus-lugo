# Xa Vén · los buses urbanos de Lugo en /demo, más una página por parada y por línea
# Stack para Portainer: pega este fichero en Stacks > Add stack > Web editor.
#
# Al arrancar, el contenedor descarga la rama indicada del repositorio de GitHub
# y la sirve con nginx. Para actualizar: haz push a GitHub y reinicia el contenedor.
# Si GitHub no responde al reiniciar, sigue sirviendo la última copia descargada.
#
# Va en Servidor-Contabo, dentro de la red de Nginx Proxy Manager, y publica el puerto 3091.
# En NPM: bus.marcogugliandolo.com -> http://bus-lugo:3000
# La ubicación del móvil solo funciona con https.
#
# El servicio bus-lugo-push es la API (/api/...): envía los avisos al móvil, recibe la posición
# de quien va en el bus y la reparte, guarda el historial de retrasos y prepara los autobuses
# de la Xunta. No publica ningún puerto y guarda todo en el volumen bus-lugo-avisos (claves,
# avisos pendientes, retrasos, interurbanos); no hay que configurar nada.
#
# Variables opcionales (Portainer > Environment variables):
#   BUS_PORT      puerto del servidor (por defecto 3091)
#   BUS_REPO      usuario/repositorio (por defecto marcogugliandolo/bus-lugo)
#   BUS_BRANCH    rama (por defecto main)
#   GITHUB_TOKEN  solo si el repositorio es privado (token con permiso de lectura)
#   OPERADOR      1 para enseñar en cada parada los minutos de su sistema de información
#                 (la página del QR de los postes). Apagado si no se pone. Ver README.
#   INTERURBANOS  0 para no descargar los horarios de los autobuses de la Xunta
#   GTFS_URL      otra dirección para el GTFS de la Xunta

services:
  bus-lugo:
    image: nginx:1.27-alpine
    container_name: bus-lugo
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 5s
    ports:
      - "${BUS_PORT:-3091}:3000"
    networks:
      - npm
      - interno
    environment:
      REPO: ${BUS_REPO:-marcogugliandolo/bus-lugo}
      BRANCH: ${BUS_BRANCH:-main}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      TZ: Europe/Madrid
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        WEB=/usr/share/nginx/html
        TMP=/tmp/bus-lugo
        rm -rf "$$TMP" && mkdir -p "$$TMP"

        fetch() {
          if [ -n "$$GITHUB_TOKEN" ]; then
            wget -q -T 30 --header "Authorization: Bearer $$GITHUB_TOKEN" \
              -O "$$TMP/src.tgz" "https://api.github.com/repos/$$REPO/tarball/$$BRANCH"
          else
            wget -q -T 30 -O "$$TMP/src.tgz" \
              "https://codeload.github.com/$$REPO/tar.gz/refs/heads/$$BRANCH"
          fi
        }

        if fetch && tar -xzf "$$TMP/src.tgz" -C "$$TMP"; then
          SRC=$$(find "$$TMP" -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ -f "$$SRC/app/demo/index.html" ] && [ -f "$$SRC/nginx.conf" ]; then
            rm -rf "$$WEB"/* "$$WEB"/.bus-version
            cp -r "$$SRC/app/." "$$WEB/"
            cp "$$SRC/nginx.conf" /etc/nginx/conf.d/default.conf
            date '+%Y-%m-%d %H:%M:%S' > "$$WEB/.bus-version"
            echo "[bus-lugo] desplegado $$REPO@$$BRANCH"
          else
            echo "[bus-lugo] el repositorio no tiene app/demo/index.html o nginx.conf"
          fi
        else
          echo "[bus-lugo] no se pudo descargar $$REPO@$$BRANCH"
        fi
        rm -rf "$$TMP"

        if [ ! -f "$$WEB/.bus-version" ]; then
          echo "[bus-lugo] no hay ninguna copia que servir; reintento en 15 s"
          sleep 15
          exit 1
        fi

        nginx -t && exec nginx -g 'daemon off;'
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  bus-lugo-push:
    image: node:22-alpine
    container_name: bus-lugo-push
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 5s
    init: true
    networks:
      - interno
    volumes:
      - bus-lugo-avisos:/data
    environment:
      REPO: ${BUS_REPO:-marcogugliandolo/bus-lugo}
      BRANCH: ${BUS_BRANCH:-main}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      DATA_DIR: /data
      RED_DIR: /srv/avisos/red
      PUSH_SUBJECT: https://bus.marcogugliandolo.com
      OPERADOR: ${OPERADOR:-}
      INTERURBANOS: ${INTERURBANOS:-1}
      GTFS_URL: ${GTFS_URL:-}
      TZ: Europe/Madrid
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        APP=/srv/avisos
        TMP=/tmp/bus-lugo
        rm -rf "$$TMP" && mkdir -p "$$TMP" "$$APP"

        fetch() {
          if [ -n "$$GITHUB_TOKEN" ]; then
            wget -q -T 30 --header "Authorization: Bearer $$GITHUB_TOKEN" \
              -O "$$TMP/src.tgz" "https://api.github.com/repos/$$REPO/tarball/$$BRANCH"
          else
            wget -q -T 30 -O "$$TMP/src.tgz" \
              "https://codeload.github.com/$$REPO/tar.gz/refs/heads/$$BRANCH"
          fi
        }

        if fetch && tar -xzf "$$TMP/src.tgz" -C "$$TMP"; then
          SRC=$$(find "$$TMP" -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ -f "$$SRC/server/push.mjs" ]; then
            cp -r "$$SRC/server/." "$$APP/"
            # La red de buses y el motor de horarios, los mismos que usa la web.
            mkdir -p "$$APP/red/data"
            cp "$$SRC/app/demo/sim.js" "$$APP/red/sim.js"
            cp "$$SRC/app/demo/data/network.json" "$$APP/red/data/network.json"
          fi
        fi
        rm -rf "$$TMP"
        cd "$$APP" || exit 1
        if [ ! -f push.mjs ]; then
          echo "[avisos] no hay copia del servicio; reintento en 15 s"
          sleep 15
          exit 1
        fi
        npm ci --omit=dev --no-audit --no-fund || npm install --omit=dev --no-audit --no-fund || { sleep 15; exit 1; }
        exec node push.mjs
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

networks:
  npm:
    external: true
    name: npm-master_default
  interno:

volumes:
  bus-lugo-avisos:
