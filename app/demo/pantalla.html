<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xa Vén · Pantalla de parada</title>
<meta name="description" content="Los próximos buses de una parada de Lugo, en grande, para una tele, una tablet o una Raspberry Pi.">
<meta name="theme-color" content="#0E1013">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
@font-face { font-family: "Atkinson Hyperlegible Next"; font-weight: 400; font-display: swap; src: url(vendor/fonts/atkinson-hyperlegible-next-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Atkinson Hyperlegible Next"; font-weight: 700; font-display: swap; src: url(vendor/fonts/atkinson-hyperlegible-next-latin-700-normal.woff2) format("woff2"); }
@font-face { font-family: "Bricolage Grotesque"; font-weight: 700; font-display: swap; src: url(vendor/fonts/bricolage-grotesque-latin-700-normal.woff2) format("woff2"); }
:root { --bg: #0E1013; --card: #181B20; --ink: #F4F5F2; --mute: #A9B1B9; --rule: #2A2F36; --live: #3DDC84; --warn: #FFC53D; --body: "Atkinson Hyperlegible Next", system-ui, sans-serif; --display: "Bricolage Grotesque", "Atkinson Hyperlegible Next", system-ui, sans-serif; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--body); }
button, input, select { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 3px solid #6C9BFF; outline-offset: 2px; }

/* Tablero */
#board { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; padding: clamp(14px, 2.4vw, 40px) clamp(16px, 3vw, 52px); gap: clamp(10px, 1.6vw, 24px); transition: padding .6s; }
.bar { display: flex; align-items: center; gap: clamp(10px, 1.5vw, 20px); }
.bar img { width: clamp(30px, 3.6vw, 56px); height: auto; border-radius: 10px; }
.bar h1 { flex: 1; min-width: 0; margin: 0; font-family: var(--display); font-size: clamp(24px, 3.6vw, 60px); line-height: 1.05; letter-spacing: -.01em; }
.bar h1 small { display: block; margin-top: 4px; font-family: var(--body); font-size: clamp(13px, 1.3vw, 22px); font-weight: 400; color: var(--mute); letter-spacing: 0; }
.clock { font-family: var(--display); font-size: clamp(28px, 4.4vw, 76px); font-weight: 700; font-variant-numeric: tabular-nums; }
.list { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: clamp(6px, .8vw, 12px); }
.row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: clamp(12px, 1.8vw, 28px); padding: clamp(10px, 1.3vw, 20px) clamp(12px, 1.6vw, 26px); border-radius: clamp(10px, 1.2vw, 18px); background: var(--card); }
.badge { min-width: clamp(54px, 6vw, 104px); padding: 0 .3em; border-radius: .28em; background: var(--c); color: #FFFFFF; font-family: var(--display); font-size: clamp(26px, 3.6vw, 62px); font-weight: 700; line-height: 1.35; text-align: center; }
.dest { font-size: clamp(20px, 2.6vw, 46px); font-weight: 700; line-height: 1.12; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dest small { display: block; margin-top: 3px; font-size: clamp(13px, 1.25vw, 22px); font-weight: 400; color: var(--mute); white-space: nowrap; }
.dest .live { color: var(--live); font-weight: 700; }
.eta { font-family: var(--display); font-size: clamp(34px, 4.8vw, 84px); font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.eta small { font-family: var(--body); font-size: .42em; font-weight: 700; }
.eta.now { color: var(--warn); }
.eta.is-live::before { content: ""; display: inline-block; width: .22em; height: .22em; margin-right: .2em; border-radius: 50%; background: var(--live); vertical-align: .35em; }
.empty { padding: 30px 0; font-size: clamp(20px, 2.4vw, 40px); color: var(--mute); text-align: center; }
.foot { margin-top: auto; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 20px; font-size: clamp(12px, 1.1vw, 18px); color: var(--mute); }
.foot .lg { display: inline-flex; align-items: center; gap: 8px; }
.foot .lg i { width: 10px; height: 10px; border-radius: 50%; background: var(--live); }
.two { flex: 1; min-height: 0; overflow: hidden; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 560px), 1fr)); gap: clamp(14px, 2vw, 32px); }
.two h2 { margin: 0 0 8px; font-size: clamp(16px, 1.8vw, 30px); color: var(--mute); }
.two section { display: flex; flex-direction: column; min-height: 0; }
.two .dest { font-size: clamp(17px, 1.9vw, 34px); white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.two .eta { font-size: clamp(28px, 3.4vw, 60px); }
.two .badge { min-width: clamp(46px, 4.6vw, 84px); font-size: clamp(22px, 2.8vw, 48px); }
#exit { position: fixed; right: 12px; bottom: 12px; padding: 8px 12px; border: 1px solid var(--rule); border-radius: 10px; background: var(--bg); color: var(--mute); font-size: 13px; text-decoration: none; opacity: 0; transition: opacity .3s; }
body:hover #exit, #exit:focus { opacity: 1; }

/* Elegir parada */
#setup { max-width: 720px; margin: 0 auto; padding: 32px 20px 60px; display: grid; gap: 18px; }
#setup h1 { margin: 0; font-family: var(--display); font-size: 34px; line-height: 1.1; }
#setup p { margin: 0; line-height: 1.45; color: var(--mute); }
#setup label { display: grid; gap: 8px; font-weight: 700; }
#setup input, #setup select { height: 52px; padding: 0 14px; border: 1px solid var(--rule); border-radius: 12px; background: var(--card); font-size: 18px; }
.results { display: grid; gap: 6px; }
.results button { display: flex; justify-content: space-between; gap: 12px; min-height: 52px; padding: 10px 14px; border: 0; border-radius: 12px; background: var(--card); text-align: left; font-size: 17px; cursor: pointer; }
.results button small { color: var(--mute); }
.chosen { display: flex; flex-wrap: wrap; gap: 8px; }
.chosen button { padding: 10px 14px; border: 1px solid var(--live); border-radius: 22px; background: transparent; font-weight: 700; cursor: pointer; }
.go { height: 56px; border: 0; border-radius: 14px; background: var(--ink); color: var(--bg); font-size: 18px; font-weight: 700; cursor: pointer; }
.go:disabled { opacity: .4; cursor: default; }
code { display: block; padding: 12px 14px; border-radius: 10px; background: var(--card); font-size: 14px; overflow-wrap: anywhere; color: var(--ink); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<script>try { var l = new URLSearchParams(location.search).get('lingua') || localStorage.getItem('xaven-lingua'); if (l === 'gl' || (!l && /^gl\b/i.test(navigator.language || ''))) document.documentElement.lang = 'gl'; } catch (e) {}</script>
</head>
<body>
<main id="board" hidden></main>
<main id="setup" hidden></main>
<a id="exit" href="pantalla.html" data-t="Cambiar de parada">Cambiar de parada</a>
<script type="module" src="pantalla.js"></script>
</body>
</html>
