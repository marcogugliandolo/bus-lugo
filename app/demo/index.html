<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buses de Lugo</title>
<meta name="description" content="Simulación en directo de los autobuses urbanos de Lugo con sus líneas y horarios oficiales.">
<meta name="theme-color" content="#121416">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map" aria-label="Mapa de Lugo con los buses en ruta"></div>
<p id="nomap" hidden>Tu navegador no puede dibujar el mapa. Las paradas y los horarios funcionan igual.</p>

<aside class="side">
  <p class="brand">Buses de Lugo</p>
  <div class="top">
    <label class="search" for="q">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <span class="sr">Buscar parada o línea</span>
      <input id="q" type="search" placeholder="Busca tu parada" autocomplete="off" enterkeyhint="search">
    </label>
    <button type="button" id="menu" class="round menu-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
      Líneas
    </button>
  </div>
  <section id="sheet" data-size="mid" aria-label="Información">
    <button type="button" id="grab" aria-label="Cambiar el tamaño del panel"><span></span></button>
    <div id="sheet-body"></div>
    <div id="simpanel" hidden>
      <label for="sim-time" class="sim-row"><span>Hora</span><output id="sim-out">10:00</output></label>
      <input id="sim-time" type="range" min="300" max="1439" step="1" value="600">
      <div class="seg" role="group" aria-label="Tipo de día">
        <button type="button" data-day="laborable">Laborable</button>
        <button type="button" data-day="sabado">Sábado</button>
        <button type="button" data-day="domingo">Domingo</button>
      </div>
      <div class="seg" role="group" aria-label="Velocidad">
        <button type="button" data-speed="1">×1</button>
        <button type="button" data-speed="10">×10</button>
        <button type="button" data-speed="60">×60</button>
      </div>
      <button type="button" id="sim-live" class="ghost">Volver a ahora</button>
    </div>
  </section>
</aside>

<button type="button" id="clock"></button>

<button type="button" id="locate" class="round" aria-label="Buscar la parada más cercana a mí">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 3 3 10.5l7.5 3 3 7.5z"></path></svg>
</button>
<div class="zoom">
  <button type="button" id="zoom-in" aria-label="Acercar">+</button>
  <button type="button" id="zoom-out" aria-label="Alejar">−</button>
</div>
<button type="button" id="credit" aria-label="Créditos del mapa">i</button>
<div id="toast" role="status" hidden></div>

<script src="vendor/maplibre-gl.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
